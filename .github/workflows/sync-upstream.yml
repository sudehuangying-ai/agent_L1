name: Sync upstream

on:
  workflow_dispatch:      

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync from upstream
        run: |
          git remote add upstream https://github.com/Eitan-S-23/agentrouter.git
          git fetch upstream main
          git merge upstream/main --allow-unrelated-histories --no-edit || exit 1
          git push
